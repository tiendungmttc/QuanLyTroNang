plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dung.accessibilitymanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dung.accessibilitymanager'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        personal {
            storeFile file('keys/qlytn-dev.jks')
            storePassword 'qlytn123456'
            keyAlias 'qlytn'
            keyPassword 'qlytn123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
